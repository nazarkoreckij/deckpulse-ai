version: "3.8"

services:
  deckpulse-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deckpulse-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
